[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DCORE_DEBUG_LEVEL=3

[env:server]
build_src_filter = +<ble_server_node.cpp>
lib_deps = marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:client]
build_src_filter = +<ble_client_gateway.cpp>

[env:i2c_scan]
build_src_filter = +<i2c_scanner.cpp>

; ===== Thiet ke WSN moi (NimBLE, Push/Write-Based) =====
[env:gateway]
build_src_filter = +<ble_gateway_node.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:sensor]
build_src_filter = +<ble_sensor_node.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:relay]
build_src_filter = +<ble_relay_node.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1
; ===== File TAP tu viet lai (xem HOC_TAP.md - Giai doan 2). Code goc o tren giu nguyen de demo =====
[env:tap_gateway]
build_src_filter = +<tap_gateway.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:tap_sensor]
build_src_filter = +<tap_sensor.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

[env:tap_relay]
build_src_filter = +<tap_relay.cpp>
build_flags = ${env.build_flags} -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
lib_deps = h2zero/NimBLE-Arduino@^2.5.1
